<div class="db-header">
  <div class="db-header-main">
    <div class="db-breadcrumb">
      <div>
        <button class="db-crumb" [class.db-crumb--dim]="selectedFamille" (click)="onDrillToRoot()">
          Tableau de bord
        </button>
        @if (selectedFamille) {
          <i class="pi pi-chevron-right db-crumb-sep"></i>
          <span class="db-crumb db-crumb--leaf">{{ capitalize(selectedFamille.nom) }}</span>
        }
      </div>
    </div>
    <div class="db-header-right">
      <div class="db-canal-seg">
        <button class="db-canal-btn" [class.db-canal-btn--active]="selectedCanal === 'VD'" (click)="onCanalChange('VD')">Direct (VD)</button>
        <button class="db-canal-btn" [class.db-canal-btn--active]="selectedCanal === 'VH'" (click)="onCanalChange('VH')">Horeca (VH)</button>
      </div>
      <div class="db-period">
        <button class="db-period-btn" (click)="onPrevPeriod()" [disabled]="!canGoPrev">
          <i class="pi pi-chevron-left"></i>
        </button>
        <span class="db-period-label">{{ formatPeriod(selectedPeriode) }}</span>
        <button class="db-period-btn" (click)="onNextPeriod()" [disabled]="!canGoNext">
          <i class="pi pi-chevron-right"></i>
        </button>
      </div>
    </div>
  </div>

  @if (selectedFdv) {
    <div class="db-fdv-indicator">
      <i class="pi pi-user"></i>
      <span>{{ selectedFdvName }}</span>
    </div>
  }
</div>
