<div class="geo-body">

  <!-- Sidebar (always in DOM; width=0 means collapsed) -->
  <aside class="geo-sidebar" [style.width.px]="sidebarWidth()">
    <!-- Drag-to-resize strip on the right edge -->
    <div class="geo-sidebar__resizer" (mousedown)="startResize($event)" title="Glisser pour redimensionner"></div>

    @if (panelOpen()) {
      <div class="geo-sidebar__tree">
        <app-product-tree
          title="Catalogue produits"
          [tree]="treeData()"
          [selection]="selection()"
          [loading]="loading()"
          (selectionChange)="onSelectionChange($event)" />
      </div>

      <div class="geo-sidebar__kpis">
        <div class="geo-kpi">
          <div class="geo-kpi__icon geo-kpi__icon--blue"><i class="pi pi-chart-bar"></i></div>
          <div class="geo-kpi__body">
            <div class="geo-kpi__label">Total ventes ({{ uniteLabel }})</div>
            @if (loading()) {
              <div class="geo-kpi__sk"></div>
            } @else {
              <div class="geo-kpi__val">{{ totalVentes() | number:'1.0-0' }}</div>
            }
          </div>
        </div>

        <div class="geo-kpi">
          <div class="geo-kpi__icon geo-kpi__icon--green"><i class="pi pi-map-marker"></i></div>
          <div class="geo-kpi__body">
            <div class="geo-kpi__label">Communes actives</div>
            @if (loading()) {
              <div class="geo-kpi__sk"></div>
            } @else {
              <div class="geo-kpi__val">{{ activeCommuneCount() }}</div>
            }
          </div>
        </div>

      </div>
    }
  </aside>

  <!-- Map -->
  <div class="geo-map">
    <app-commune-map
      [data]="mapData()"
      [selectedCode]="commune()?.code ?? null"
      [canal]="canal()"
      [canalOptions]="canals"
      [periodes]="periodes()"
      [dateFrom]="dateFrom()"
      [dateTo]="dateTo()"
      (communeSelect)="setCommune($event)"
      (canalChange)="setCanal($event)"
      (rangeChange)="onRangeChange($event)" />

    <!-- Floating controls overlay -->
    @if (selectionLabel()) {
      <div class="geo-map-controls">
        <span class="geo-tag">
          <i [class]="'pi ' + selectionLabel()!.icon"></i>
          {{ selectionLabel()!.text }}
          <button (click)="clearSelection()" aria-label="Effacer le filtre">×</button>
        </span>
      </div>
    }
  </div>

  <!-- Full-page commune analytics overlay -->
  <app-commune-drawer
    [commune]="commune()"
    [dateFrom]="dateFrom()"
    [dateTo]="dateTo()"
    [canal]="canal()"
    [periodes]="periodes()"
    [canalOptions]="canals"
    (canalChange)="setCanal($event)"
    (rangeChange)="onRangeChange($event)"
    (closed)="clearCommune()" />

</div>
