<div class="db-kpi-grid">
  @if (loading) {
    @for (_ of skeletonRows; track $index; let i = $index) {
      <div class="db-kpi-sk" [style.animation-delay]="i * 80 + 'ms'">
        <div class="db-kpi-sk__label"></div>
        <div class="db-kpi-sk__value"></div>
        <div class="db-kpi-sk__bar"></div>
      </div>
    }
  }
  @if (!loading && data && data.familles.length === 0) {
    <div class="db-no-data"><i class="pi pi-inbox"></i><span>Aucune donnée pour cette période</span></div>
  }
  @if (data) {
    @for (f of data.familles; track f.nom) {
      @let pct = objPct(f);
      <button class="db-kpi-card"
              [class.db-kpi-card--active]="selectedFamille?.nom === f.nom"
              [style.--fc]="familyColor(f.nom)"
              [style.--fbg]="familyBg(f.nom)"
              (click)="onSelectFamille(f)">

        <!-- Top: name + volume section | objective ring -->
        <div class="db-kpi-card__main">
          <div class="db-kpi-card__left">
            <span class="db-kpi-card__label">{{ capitalize(f.nom) || 'Autres' }}</span>
            <div class="db-kpi-card__value-row">
              <span class="db-kpi-card__value">{{ displayVal(displayValues[f.nom]) }}</span>
              <span class="db-kpi-card__unit">t</span>
            </div>
            <div class="db-kpi-card__meta">
              <span class="db-kpi-card__prev">vs {{ formatNum(f.total_prev) }} préc.</span>
              @if (f.delta_pct !== null) {
                <span class="db-kpi-badge"
                      [class.db-kpi-badge--up]="f.delta_pct > 0"
                      [class.db-kpi-badge--down]="f.delta_pct < 0"
                      [class.db-kpi-badge--flat]="f.delta_pct === 0">
                  <i class="pi" [class.pi-arrow-up-right]="f.delta_pct > 0" [class.pi-arrow-down-right]="f.delta_pct <= 0"></i>
                  {{ formatDelta(f.delta_pct) }}
                </span>
              }
            </div>
          </div>

          <div class="db-kpi-card__right">
            <div class="db-kpi-card__obj-box">
              <span class="db-kpi-card__ca">{{ formatCa(f.ca) }}</span>
              <i class="pi pi-minus db-kpi-card__action-icon"></i>
            </div>
          </div>
        </div>

        <!-- Bottom: progress bar -->
        @if (f.objectif_tonne || f.objectif_packs) {
          <div class="db-kpi-card__footer">
            <div class="db-kpi-card__footer-label">
              <span>Obj. {{ formatObj(f) }} t</span>
              <span [style.color]="familyColor(f.nom)">{{ pct }}%</span>
            </div>
            <div class="db-kpi-obj__bar-track">
              <div class="db-kpi-obj__bar-fill"
                   [style.width.%]="Math.min(pct, 100)"
                   [style.background]="familyColor(f.nom)"></div>
            </div>
          </div>
        }
      </button>
    }
  }
</div>
