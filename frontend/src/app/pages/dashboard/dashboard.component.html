<div class="db-root">

  <!-- Header: breadcrumb, period nav, canal/mode toggles, FDV pills -->
  <app-dashboard-header
    (prevPeriod)="onPrevPeriod()"
    (nextPeriod)="onNextPeriod()"
    (canalChange)="onCanalChange($event)"
    (displayModeChange)="onDisplayModeChange($event)"
    (fdvSelect)="onFdvSelect($event)"
    (distributeurSelect)="onDistributeurSelect($event)"
    (distributeurClear)="onDistributeurClear()"
    (distMenuToggle)="onDistMenuToggle()"
    (drillToRoot)="onDrillToRoot()"
    (pillTooltipToggle)="onPillTooltipToggle($event)">
  </app-dashboard-header>

  <!-- KPI grid: animated famille cards with sparklines -->
  <app-dashboard-overview
    (familleSelect)="onFamilleSelect($event)"
    (pinToggle)="onPinToggle($event)">
  </app-dashboard-overview>

  <!-- Pinned families comparison bar -->
  <app-dashboard-pinned-summary
    (pinToggle)="onPinToggleFromPinned($event)"
    (pinnedClear)="onPinnedClear()">
  </app-dashboard-pinned-summary>

  <!-- Bottom: product tree (left) + FDV performance (right) -->
  <div class="db-middle" [class.db-middle--loading]="state.loading()">
    <app-dashboard-product-tree
      (sfCollapseToggle)="onSfCollapseToggle($event)"
      (overviewFamilleToggle)="onOverviewFamilleToggle($event)"
      (productSelect)="onProductSelect($event)">
    </app-dashboard-product-tree>

    <app-dashboard-fdv-performance
      (fdvSelect)="onFdvSelectFromPerf($event)">
    </app-dashboard-fdv-performance>
  </div>

</div>
